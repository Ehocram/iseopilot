# ============================================================
# ISEOPilot — deploy su server CONDIVISO con Flusso-AI (10.1.10.139)
#
# Modello: compose INDIPENDENTE (non tocca quello di Flusso-AI).
# Rete: il container sta su "proxy-net" (condivisa SOLO col Caddy) e su una
#       rete interna sua. NON è sulla rete dati di Flusso-AI, quindi non vede
#       il suo database. Nessuna porta pubblicata sull'host: l'unico ingresso
#       è il Caddy via proxy-net.
# Risorse: tetto di RAM/CPU per non far scattare l'OOM killer su Flusso-AI.
# ============================================================
services:
  iseopilot:
    build: .
    image: iseopilot:latest
    container_name: iseopilot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - iseopilot_data:/data        # DB SQLite, token per-utente, catalogo Dynamics
      - /mnt/dfs:/mnt/dfs:ro          # cartelle DFS aziendali (mount CIFS host, SOLA LETTURA)
      # Codice sorgente per la pagina Sviluppatore: SOLA LETTURA, deliberatamente.
      # L'applicazione legge e propone; ad applicare e pubblicare e' l'agente
      # iseopilot-deploy-agent, che gira sull'host. Cosi' l'app non puo'
      # modificare se stessa e non serve il socket Docker nel container.
      - /opt/iseopilot:/repo:ro
      # Socket dell'agente di deploy, che vive sull'host. Non e' una porta:
      # dentro il container 127.0.0.1 sarebbe il container stesso.
      - /run/iseopilot:/run/iseopilot
    networks:
      - proxy-net                   # condivisa col Caddy di Flusso-AI
      - internal                    # privata (per eventuali servizi futuri)
      - presidio-net                # solo verso il sidecar Presidio (PRESIDIO_URL nel .env)
    mem_limit: 3g                    # tetto RAM (ChromaDB + embedding ~1-2 GB)
    memswap_limit: 3g                # niente swap oltre il limite
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ── Worker ML di Dub Studio (Incremento 9) ─────────────────
  # Immagine SEPARATA (pin rigidi di chatterbox-tts), stessa volume dati,
  # NESSUNA porta e nessuna rete proxy: parla con l'app solo via file su
  # /data/dub. Tetti CPU/RAM: un job può essere lento, mai affamare la VM
  # condivisa (Flusso-AI, iseo-training, chat ISEOPilot).
  dubworker:
    build:
      context: .
      dockerfile: Dockerfile.dubworker
    image: iseopilot-dubworker:latest
    container_name: iseopilot-dubworker
    restart: unless-stopped
    volumes:
      - iseopilot_data:/data
    networks:
      - internal
    mem_limit: 6g
    memswap_limit: 6g
    cpus: 4.0

  # ── Sidecar Presidio (protezione dati verso Claude) ────────
  # Immagine SEPARATA, senza stato: riceve testo da iseopilot e restituisce
  # solo intervalli (persone, telefoni, documenti). Rete dedicata «internal:
  # true» (niente uscita su internet), nessuna porta, nessun .env (che contiene
  # APP_SECRET_KEY): riceve solo il token. Senza token di almeno 32 caratteri
  # resta «non pronto» e iseopilot procede con dizionario + regole, avvisando.
  # NESSUN depends_on in iseopilot: «up -d iseopilot» non deve costruire né
  # avviare Presidio per caso. Si costruisce e si avvia a mano (DEPLOY.md).
  presidio:
    build:
      context: .
      dockerfile: Dockerfile.presidio
    image: iseopilot-presidio:latest
    container_name: iseopilot-presidio
    restart: unless-stopped
    environment:
      PRESIDIO_TOKEN: ${PRESIDIO_TOKEN:-}   # niente «:?»: un .env incompleto bloccherebbe ogni comando compose
    networks:
      - presidio-net
    mem_limit: 1g
    memswap_limit: 1g                # niente swap oltre il limite
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp                         # file di heartbeat del worker gunicorn
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000/ready', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

networks:
  proxy-net:
    external: true                  # creata a mano (vedi DEPLOY.md)
  internal:
    driver: bridge
  presidio-net:
    driver: bridge
    internal: true                  # solo iseopilot <-> presidio, nessuna uscita

volumes:
  iseopilot_data:
